[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sure-rag"
version = "0.0.0"
description = "Framework-agnostic evidence sufficiency verification protocol for RAG answer routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "SURE-RAG Contributors" }
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
]
keywords = ["rag", "verification", "evidence-sufficiency", "routing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "mypy>=1.10",
]
torch = []
server = []
langchain = []
llamaindex = []
haystack = []
guardrails = []
nemo = []

[project.scripts]
surerag = "surerag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/surerag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["surerag"]
